
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System JS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; color: white; font-family: 'Inter', sans-serif; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        canvas { display: block; }
        #labels-container { pointer-events: none; position: absolute; inset: 0; z-index: 10; }
        .planet-label { position: absolute; pointer-events: auto; transform: translate(-50%, -50%); cursor: pointer; transition: all 0.3s; }
        .planet-label:hover { scale: 1.1; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
    <script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.162.0",
    "three/addons/": "https://esm.sh/three@0.162.0/examples/jsm/",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "@google/genai": "https://esm.sh/@google/genai@1.40.0",
    "three/": "https://esm.sh/three@^0.182.0/",
    "react": "https://esm.sh/react@^19.2.4",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.5.0",
    "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@react-three/postprocessing": "https://esm.sh/@react-three/postprocessing@^3.0.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="app">
        <div id="labels-container"></div>
        
        <!-- UI: Header -->
        <div class="absolute top-8 left-8 z-20 pointer-events-none">
            <h1 class="text-white font-orbitron text-4xl font-black tracking-tighter leading-none mb-2">КОСМОС.JS<span class="text-cyan-500">_</span></h1>
            <p className="text-white/30 text-[10px] font-bold tracking-[0.5em] uppercase opacity-50">СИСТЕМА ВИЗУАЛИЗАЦИИ v4.0</p>
        </div>

        <!-- UI: Sidebar (Hidden by default) -->
        <div id="sidebar" class="fixed inset-y-0 right-0 w-full sm:w-[450px] bg-black/80 backdrop-blur-2xl border-l border-white/10 z-50 transform translate-x-full transition-transform duration-500 flex flex-col">
            <div class="p-8 border-b border-white/10 flex justify-between items-center">
                <div id="sb-title-box">
                    <h2 id="sb-name" class="text-4xl font-black font-orbitron uppercase leading-none">ЗЕМЛЯ</h2>
                    <span class="text-[10px] font-bold tracking-[0.3em] uppercase text-white/40">Планетарные данные</span>
                </div>
                <button id="close-sidebar" class="p-2 hover:bg-white/10 rounded-full transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-8 space-y-8 custom-scrollbar">
                <p id="sb-desc" class="text-lg font-light text-white/80 leading-relaxed"></p>
                <div id="sb-facts" class="space-y-3"></div>
                <div class="p-6 bg-gradient-to-br from-indigo-900/40 to-black rounded-2xl border border-white/10">
                    <h4 class="text-[10px] font-bold tracking-[0.2em] uppercase text-indigo-400 mb-4 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sparkles"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.937A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0l1.582 6.135A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .962L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
                        Инсайты Gemini
                    </h4>
                    <div id="sb-ai-insights" class="text-sm text-white/70 space-y-4">
                        <div class="animate-pulse space-y-2">
                            <div class="h-2 bg-white/10 rounded w-3/4"></div>
                            <div class="h-2 bg-white/10 rounded w-full"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-8">
                <button id="back-btn" class="w-full py-4 bg-white text-black font-bold uppercase tracking-widest text-[10px] rounded-xl hover:bg-cyan-500 hover:text-white transition-all">Назад в космос</button>
            </div>
        </div>
    </div>
    <script type="module" src="index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
